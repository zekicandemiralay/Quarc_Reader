server {
    listen 443 ssl;
    server_name quarcnet0.tail84500c.ts.net;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/ssl/quarcnet0.tail84500c.ts.net.crt;
    ssl_certificate_key /etc/nginx/ssl/quarcnet0.tail84500c.ts.net.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Shared login (Quarc Auth) — same account works across every Quarc app.
    # More specific than /api/ below, so nginx matches this first for auth routes.
    location /api/auth/ {
        proxy_pass http://quarc-auth:3002/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
    }

    # PDFs go up in 8 MB chunks and come down with Range requests (pdf.js
    # reads only the pages being looked at), so nothing here needs buffering.
    location /api/ {
        proxy_pass http://backend:3008/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 64m;
    }

    # Module scripts (pdf.js' worker is one) are only run when served as JavaScript. Older nginx images do not know ".mjs"
    # and would send a generic download. The build names the worker ".js" now; this covers any other .mjs file.
    location ~* \.mjs$ {
        default_type text/javascript;
    }

    # Service worker must never be served stale.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # The app shell (index.html names the content-hashed scripts of THIS build) must be checked with the server on every load.
    # Without a Cache-Control header a browser may keep index.html for hours on its own guess, and a deploy stays invisible
    # until a hard reload (Shift+F5). "no-cache" still lets it answer 304 Not Modified when nothing changed. Every route of the
    # app (/, /read/<id>, /s/<token>) is served as /index.html by the fallback below, so this covers them too.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Share links (/s/<token>) and every other app route are client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
